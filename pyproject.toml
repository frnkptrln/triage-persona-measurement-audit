[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "triage-persona-measurement-audit"
version = "0.1.0"
description = "A preregistered measurement audit of persona-framed synthetic LLM triage"
requires-python = ">=3.10"

[project.optional-dependencies]
analysis = ["matplotlib>=3.8", "numpy>=1.26"]
model = ["torch>=2.4", "transformers>=4.54", "accelerate>=1.2"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools]
py-modules = ["triage_persona_instrument", "run_model", "triage_persona_v02"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
